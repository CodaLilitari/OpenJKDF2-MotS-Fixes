name: Windows x64 retail-fidelity build verification

on:
  workflow_dispatch:
  push:
    branches:
      - retail-fidelity-x64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_DIR: ${{ github.workspace }}/build_win64
      PACKAGE_DIR: ${{ github.workspace }}/package_win64
      ARCHIVE_PATH: ${{ github.workspace }}/OpenJKDF2-retail-fidelity-windows-x64-evaluation.zip

    steps:
      - name: Check out exact source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install x86-64 MinGW build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install \
            -y --no-install-suggests --no-install-recommends \
            build-essential \
            clang \
            cmake \
            file \
            make \
            mingw-w64 \
            python3 \
            python3-pip \
            python3-venv \
            zip \
            zsh
          sudo update-alternatives \
            --set x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives \
            --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install the pinned source generator
        run: |
          python3 -m venv "$RUNNER_TEMP/openjkdf2-cog"
          "$RUNNER_TEMP/openjkdf2-cog/bin/python" \
            -m pip install --disable-pip-version-check cogapp==3.6.0
          echo "$RUNNER_TEMP/openjkdf2-cog/bin" >> "$GITHUB_PATH"

      - name: Record pristine source provenance
        run: |
          git status --porcelain=v1 > "$RUNNER_TEMP/SOURCE_STATUS_BEFORE_BUILD.txt"
          test ! -s "$RUNNER_TEMP/SOURCE_STATUS_BEFORE_BUILD.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT.txt"
          git submodule status --recursive > "$RUNNER_TEMP/SUBMODULES.txt"
          if grep -Eq '^[-+U]' "$RUNNER_TEMP/SUBMODULES.txt"; then
            cat "$RUNNER_TEMP/SUBMODULES.txt" >&2
            echo 'Submodules are not initialized at their recorded commits.' >&2
            exit 1
          fi

      - name: Run fork regression tests on the host
        run: |
          g++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -DQOL_IMPROVEMENTS \
            -Isrc \
            src/Tests/fork_regression_test.cpp \
            -o "$RUNNER_TEMP/fork_regression_test"
          "$RUNNER_TEMP/fork_regression_test"
          python3 src/Tests/run_cog_locality_test.py --cc gcc --ubsan

      - name: Configure the full Windows x64 build
        run: |
          OPENJKDF2_RELEASE_COMMIT="$(git rev-parse HEAD)" \
          OPENJKDF2_RELEASE_COMMIT_SHORT="$(git rev-parse --short=8 HEAD)" \
          cmake \
            -S . \
            -B "$BUILD_DIR" \
            --toolchain "$GITHUB_WORKSPACE/cmake_modules/toolchain_mingw.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build host protobuf tools
        run: |
          cmake --build "$BUILD_DIR" --target PROTOBUF --parallel 2 \
            || cmake --build "$BUILD_DIR" --target PROTOBUF --parallel 1
          cmake --build "$BUILD_DIR" --target PROTOC --parallel 2 \
            || cmake --build "$BUILD_DIR" --target PROTOC --parallel 1

      - name: Build OpenJKDF2 for Windows x64
        run: |
          cmake --build "$BUILD_DIR" --target openjkdf2-64 --parallel 2

      - name: Stage the executable and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          zsh scripts/helper_CopyMinGWDLLs.sh || true
          mkdir -p "$PACKAGE_DIR/licenses"
          cp "$BUILD_DIR/openjkdf2-64.exe" "$PACKAGE_DIR/"
          cp README.md "$PACKAGE_DIR/README-OpenJKDF2.md"
          cp CHANGELOG_FORK.md "$PACKAGE_DIR/"
          cp RETAIL_FIDELITY.md "$PACKAGE_DIR/README-RETAIL-FIDELITY.md"
          cp THIRD_PARTY_NOTICES.md "$PACKAGE_DIR/"
          shopt -s nullglob
          for dll in "$BUILD_DIR"/*.dll; do
            cp "$dll" "$PACKAGE_DIR/"
          done
          freeglut_dll="$(
            find "$BUILD_DIR/freeglut" -type f -iname '*freeglut.dll' -print -quit
          )"
          test -n "$freeglut_dll"
          cp "$freeglut_dll" "$PACKAGE_DIR/"
          test -f "$PACKAGE_DIR/OpenAL32.dll"
          test -f "$PACKAGE_DIR/libGameNetworkingSockets.dll"
          copy_license() {
            local source="$1"
            local destination="$2"
            test -f "$source"
            cp "$source" "$PACKAGE_DIR/licenses/$destination"
          }

          copy_license LICENSE.md OpenJKDF2-LICENSE.md
          copy_license 3rdparty/json/LICENSE.MIT nlohmann-json-LICENSE.MIT
          copy_license src/external/libsmacker/COPYING libsmacker-COPYING-LGPL-2.1.txt
          copy_license src/external/libsmusher/LICENSE libsmusher-LICENSE.txt
          copy_license src/external/fcaseopen/LICENSE.txt fcaseopen-LICENSE.txt
          copy_license src/external/nativefiledialog-extended/LICENSE nativefiledialog-extended-LICENSE.txt
          copy_license flex/COPYING flex-COPYING.txt
          copy_license byacc/README byacc-README.txt
          copy_license byacc/NO_WARRANTY byacc-NO_WARRANTY.txt
          copy_license lib/SDL/LICENSE.txt SDL-LICENSE.txt
          copy_license lib/SDL/src/hidapi/LICENSE.txt SDL-hidapi-LICENSE-selector.txt
          copy_license lib/SDL/src/hidapi/LICENSE-bsd.txt SDL-hidapi-LICENSE-BSD.txt
          copy_license lib/SDL/src/video/yuv2rgb/LICENSE SDL-yuv2rgb-LICENSE.txt
          copy_license lib/SDL_mixer/LICENSE.txt SDL_mixer-LICENSE.txt
          copy_license lib/SDL_mixer/src/dr_libs/LICENSE dr_libs-LICENSE.txt
          copy_license lib/SDL_mixer/external/ogg/COPYING ogg-COPYING.txt
          copy_license lib/SDL_mixer/external/vorbis/COPYING vorbis-COPYING.txt
          copy_license lib/SDL_mixer/external/opus/COPYING opus-COPYING.txt
          copy_license lib/SDL_mixer/external/opus/LICENSE_PLEASE_READ.txt opus-LICENSE_PLEASE_READ.txt
          copy_license lib/SDL_mixer/external/opusfile/COPYING opusfile-COPYING.txt
          copy_license lib/freeglut/COPYING freeglut-COPYING.txt
          copy_license lib/glew/LICENSE.txt GLEW-LICENSE.txt
          copy_license lib/libpng/LICENSE libpng-LICENSE.txt
          copy_license lib/zlib/LICENSE zlib-LICENSE.txt
          copy_license lib/physfs/LICENSE.txt PhysicsFS-LICENSE.txt
          copy_license lib/openal/COPYING OpenAL-Soft-COPYING-LGPL-2.0.txt
          copy_license lib/openal/BSD-3Clause OpenAL-Soft-BSD-3-Clause.txt
          copy_license lib/GameNetworkingSockets/LICENSE GameNetworkingSockets-LICENSE.txt
          copy_license lib/GameNetworkingSockets/src/external/picojson/LICENSE picojson-LICENSE.txt
          copy_license lib/GameNetworkingSockets/src/external/abseil/LICENSE Abseil-LICENSE.txt
          copy_license lib/GameNetworkingSockets/src/external/abseil/LICENSE Apache-2.0.txt
          copy_license lib/GameNetworkingSockets/src/external/webrtc/LICENSE WebRTC-LICENSE.txt
          copy_license lib/protobuf/LICENSE protobuf-LICENSE.txt
          copy_license resource/ssl/cacert.pem Mozilla-NSS-cacert-source.pem

          : > "$PACKAGE_DIR/licenses/MinGW-static-runtime-PACKAGES.txt"
          declare -A copied_runtime_packages=()
          for archive_name in \
            libstdc++.a \
            libssp.a \
            libwinpthread.a \
            libmingwex.a \
            libmingw32.a \
            libgcc.a \
            libgcc_eh.a; do
            archive_path="$(
              readlink -f "$(
                x86_64-w64-mingw32-gcc -print-file-name="$archive_name"
              )"
            )"
            test -f "$archive_path"
            archive_package="$(
              dpkg-query -S "$archive_path" \
                | sed -n '1s/: .*//p'
            )"
            test -n "$archive_package"
            printf '%s: ' "$archive_name" \
              >> "$PACKAGE_DIR/licenses/MinGW-static-runtime-PACKAGES.txt"
            dpkg-query -W -f='${Package} ${Version}\n' "$archive_package" \
              >> "$PACKAGE_DIR/licenses/MinGW-static-runtime-PACKAGES.txt"

            if [[ -z "${copied_runtime_packages[$archive_package]+x}" ]]; then
              package_name="${archive_package%%:*}"
              # Debian package lists may expose only this doc-directory symlink.
              package_copyright="/usr/share/doc/$package_name/copyright"
              test -f "$package_copyright"
              safe_package="${archive_package//[^A-Za-z0-9_.-]/_}"
              cp -L \
                "$package_copyright" \
                "$PACKAGE_DIR/licenses/MinGW-$safe_package-COPYRIGHT.txt"
              copied_runtime_packages[$archive_package]=1
            fi
          done

      - name: Prove PE32+ AMD64 architecture
        shell: bash
        run: |
          set -euo pipefail
          : > "$PACKAGE_DIR/PE_ARCHITECTURE.txt"
          mapfile -d '' pe_files < <(
            find "$PACKAGE_DIR" -type f \
              \( -iname '*.exe' -o -iname '*.dll' \) \
              -print0 \
              | sort -z
          )
          test "${#pe_files[@]}" -gt 0
          for binary in "${pe_files[@]}"; do
            printf '### %s\n' "$(basename "$binary")" \
              | tee -a "$PACKAGE_DIR/PE_ARCHITECTURE.txt"
            objdump_output="$(x86_64-w64-mingw32-objdump -f "$binary")"
            file_output="$(file "$binary")"
            printf '%s\n%s\n' "$objdump_output" "$file_output" \
              | tee -a "$PACKAGE_DIR/PE_ARCHITECTURE.txt"
            grep -q 'file format pei-x86-64' <<< "$objdump_output"
            grep -q 'architecture: i386:x86-64' <<< "$objdump_output"
            grep -q 'PE32+.*x86-64' <<< "$file_output"
          done
          python3 - <<'PY'
          from pathlib import Path

          package = Path("package_win64")
          paths = sorted(
              path
              for path in package.rglob("*")
              if path.is_file() and path.suffix.lower() in {".exe", ".dll"}
          )
          assert paths, "No packaged PE files found"
          for path in paths:
              data = path.read_bytes()
              assert data[:2] == b"MZ", f"{path}: missing DOS MZ signature"
              pe_offset = int.from_bytes(data[0x3C:0x40], "little")
              assert data[pe_offset:pe_offset + 4] == b"PE\0\0", (
                  f"{path}: missing PE signature"
              )
              machine = int.from_bytes(data[pe_offset + 4:pe_offset + 6], "little")
              optional_magic = int.from_bytes(
                  data[pe_offset + 24:pe_offset + 26], "little"
              )
              assert machine == 0x8664, (
                  f"{path}: expected AMD64 0x8664, found 0x{machine:04X}"
              )
              assert optional_magic == 0x020B, (
                  f"{path}: expected PE32+ 0x020B, found 0x{optional_magic:04X}"
              )
              print(
                  f"{path}: AMD64 machine=0x{machine:04X}, "
                  f"PE32+ magic=0x{optional_magic:04X}"
              )
          PY

      - name: Audit packaged DLL closure
        shell: bash
        run: |
          set -euo pipefail
          : > "$PACKAGE_DIR/PE_IMPORTS.txt"
          missing=0

          is_windows_system_dll() {
            local dll="${1^^}"
            case "$dll" in
              API-MS-WIN-*.DLL|EXT-MS-WIN-*.DLL|ADVAPI32.DLL|AVRT.DLL|BCRYPT.DLL|COMCTL32.DLL|COMDLG32.DLL|CRYPT32.DLL|DBGCORE.DLL|DBGHELP.DLL|DNSAPI.DLL|DWMAPI.DLL|GDI32.DLL|IMAGEHLP.DLL|IMM32.DLL|IPHLPAPI.DLL|KERNEL32.DLL|KSUSER.DLL|MSVCRT.DLL|NTDLL.DLL|OLE32.DLL|OLEACC.DLL|OLEAUT32.DLL|OPENGL32.DLL|POWRPROF.DLL|PSAPI.DLL|RPCRT4.DLL|SETUPAPI.DLL|SHELL32.DLL|SHLWAPI.DLL|USER32.DLL|UXTHEME.DLL|VERSION.DLL|WINMM.DLL|WINTRUST.DLL|WS2_32.DLL)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -d '' pe_files < <(
            find "$PACKAGE_DIR" -type f \
              \( -iname '*.exe' -o -iname '*.dll' \) \
              -print0 \
              | sort -z
          )
          test "${#pe_files[@]}" -gt 0
          for binary in "${pe_files[@]}"; do
            printf '### %s\n' "$(basename "$binary")" >> "$PACKAGE_DIR/PE_IMPORTS.txt"
            objdump_output="$(x86_64-w64-mingw32-objdump -p "$binary")"
            while IFS= read -r dll; do
              test -n "$dll" || continue
              printf 'DLL Name: %s\n' "$dll" >> "$PACKAGE_DIR/PE_IMPORTS.txt"
              if is_windows_system_dll "$dll"; then
                continue
              fi
              if find "$PACKAGE_DIR" -maxdepth 1 -type f -iname "$dll" -print -quit \
                   | grep -q .; then
                continue
              fi
              printf 'Missing non-system dependency: %s (imported by %s)\n' \
                "$dll" "$(basename "$binary")" >&2
              missing=1
            done <<< "$(
              sed -n 's/^[[:space:]]*DLL Name: //p' <<< "$objdump_output"
            )"
          done

          test "$missing" -eq 0

      - name: Write reproducibility records and archive
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/SOURCE_COMMIT.txt" "$PACKAGE_DIR/"
          cp "$RUNNER_TEMP/SOURCE_STATUS_BEFORE_BUILD.txt" "$PACKAGE_DIR/"
          cp "$RUNNER_TEMP/SUBMODULES.txt" "$PACKAGE_DIR/"
          {
            printf 'Fork source: %s/%s/tree/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Upstream project: https://github.com/shinyquagsire23/OpenJKDF2\n'
            printf '\nExact engine, vendored, and submodule source checkout:\n'
            printf '  git clone --recurse-submodules %s/%s.git\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            printf '  git -C OpenJKDF2 checkout %s\n' "$GITHUB_SHA"
            printf '  git -C OpenJKDF2 submodule update --init --recursive\n'
            printf 'Compiler runtime package/version records are in licenses/MinGW-static-runtime-PACKAGES.txt.\n'
            printf 'Game data is not included; a licensed JK or MotS installation is required.\n'
          } > "$PACKAGE_DIR/SOURCE_URL.txt"
          git status --porcelain=v1 > "$PACKAGE_DIR/SOURCE_STATUS_AFTER_BUILD.txt"
          while IFS= read -r status_line; do
            case "$status_line" in
              ' M lib/GameNetworkingSockets'|' M lib/SDL_mixer'|' M lib/physfs'|'?? package_win64/')
                ;;
              *)
                printf 'Unexpected source-tree mutation: %s\n' "$status_line" >&2
                exit 1
                ;;
            esac
          done < "$PACKAGE_DIR/SOURCE_STATUS_AFTER_BUILD.txt"
          git submodule foreach --recursive '
            printf "### %s (%s)\n" "$displaypath" "$(git rev-parse HEAD)"
            git status --short
            git diff --binary
          ' > "$PACKAGE_DIR/SUBMODULE_WORKTREES_AFTER_BUILD.txt"
          {
            cmake --version
            x86_64-w64-mingw32-gcc --version
            x86_64-w64-mingw32-g++ --version
            x86_64-w64-mingw32-ld --version
            python3 --version
            "$RUNNER_TEMP/openjkdf2-cog/bin/python" -m pip show cogapp
            printf '\nUbuntu MinGW package versions:\n'
            dpkg-query -W -f='${Package} ${Version}\n' \
              binutils-mingw-w64-x86-64 \
              gcc-mingw-w64-x86-64-posix \
              gcc-mingw-w64-x86-64-posix-runtime \
              g++-mingw-w64-x86-64-posix \
              mingw-w64-common \
              mingw-w64-x86-64-dev
          } > "$PACKAGE_DIR/BUILD_TOOLCHAIN.txt"
          (
            cd "$PACKAGE_DIR"
            find . -type f ! -path './SHA256SUMS.txt' -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$PACKAGE_DIR/SHA256SUMS.txt"
          (
            cd "$PACKAGE_DIR"
            sha256sum -c SHA256SUMS.txt
          )
          (
            cd "$PACKAGE_DIR"
            zip -9 -r "$ARCHIVE_PATH" .
          )
          zip -T "$ARCHIVE_PATH"
          (
            cd "$(dirname "$ARCHIVE_PATH")"
            sha256sum "$(basename "$ARCHIVE_PATH")"
          ) > "$ARCHIVE_PATH.sha256"
